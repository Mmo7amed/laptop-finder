<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptops | Student Laptop Finder</title>
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="saver">
  <header class="border-b border-slate-400/20">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">
      <a href="index.html" class="text-xl font-extrabold">Student<span class="text-green-600">Laptop</span>Finder</a>
      <div class="flex items-center gap-2">
        <button id="themeButton" class="btn-action text-sm">Battery Saver</button>
        <button id="menuButton" class="btn-action text-sm md:hidden">Menu</button>
      </div>
      <nav id="navMenu" class="absolute left-0 right-0 top-20 z-10 hidden flex-col gap-1 border-b border-slate-400/20 p-4 md:static md:flex md:flex-row md:border-0 md:p-0"><a class="nav-link rounded-lg px-3 py-2 font-medium" href="index.html">Home</a><a class="nav-link rounded-lg px-3 py-2 font-medium" href="laptops.html">Laptops</a><a class="nav-link rounded-lg px-3 py-2 font-medium" href="favorites.html">Favorites</a><a class="nav-link rounded-lg px-3 py-2 font-medium" href="compare.html">Compare</a></nav>
    </div>
  </header>
  <main class="mx-auto min-h-[75vh] max-w-7xl px-4 py-10">
    
<div id="pageContent">
  <div class="flex flex-wrap items-end justify-between gap-4"><div><p class="muted font-semibold">CATALOGUE</p><h1 class="mt-1 text-3xl font-extrabold">Find your laptop</h1><p class="muted mt-2">Search and combine filters to find what suits you.</p></div><p class="font-semibold"><span id="resultCount">0</span> results</p></div>
  <section class="panel mt-7 grid gap-4 rounded-2xl border p-5 sm:grid-cols-2 lg:grid-cols-5">
    <label class="text-sm font-semibold">Search<input id="search" type="search" placeholder="Name or brand..." class="mt-2 w-full rounded-xl"></label>
    <label class="text-sm font-semibold">Category<select id="category" class="mt-2 w-full rounded-xl"><option value="">All categories</option><option>ultrabook</option><option>gaming</option><option>2-in-1</option><option>creator</option><option>budget</option></select></label>
    <label class="text-sm font-semibold">Maximum price ($)<input id="maxPrice" type="number" min="0" placeholder="Any price" class="mt-2 w-full rounded-xl"></label>
    <label class="text-sm font-semibold">Minimum RAM<select id="minRam" class="mt-2 w-full rounded-xl"><option value="">Any RAM</option><option value="8">8 GB</option><option value="16">16 GB</option><option value="32">32 GB</option></select></label>
    <label class="text-sm font-semibold">Sort by<select id="sort" class="mt-2 w-full rounded-xl"><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="batteryHours-desc">Battery: high to low</option><option value="batteryHours-asc">Battery: low to high</option><option value="weightKg-asc">Weight: light to heavy</option><option value="weightKg-desc">Weight: heavy to light</option></select></label>
  </section>
  <section id="laptopGrid" class="mt-7 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></section>
</div>

  </main>
  <footer class="border-t border-slate-400/20 px-4 py-6 text-center text-sm muted">Student Laptop Finder · SW302 Assignment 2</footer>
  <script type="module" src="./src/js/laptops.js"></script>
</body>
</html>
